openapi: 3.0.3
info:
  title: Acquaman Plugin API
  version: 0.1.0
  description: Mock API contract for an OpenAI Codex plugin scaffold.
servers:
  - url: http://localhost:3333
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check endpoint
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /capabilities:
    get:
      operationId: listCapabilities
      summary: List plugin capabilities
      responses:
        '200':
          description: Plugin capability list
          content:
            application/json:
              schema:
                type: object
                properties:
                  capabilities:
                    type: array
                    items:
                      type: string
                example:
                  capabilities:
                    - health
                    - capabilities
